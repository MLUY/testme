<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Project Planner</h1>

    <section>
      <div class="section-head">
        <h2>Tasks</h2>
        <button id="add-task" type="button">+ Add task</button>
      </div>
      <div class="table-wrap">
        <table id="task-table">
          <thead>
            <tr>
              <th>Task</th>
              <th>Start date</th>
              <th>Duration (days)</th>
              <th>End date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="task-body"></tbody>
        </table>
      </div>
      <p id="empty-msg" class="muted" hidden>No tasks yet. Click “Add task” to get started.</p>
    </section>

    <section>
      <h2>Gantt chart</h2>
      <div id="gantt" class="gantt"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
